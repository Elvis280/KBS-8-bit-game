<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Storybook Illustrated Sanctuary Lectern & Ancient Tome -->
  <!-- Ground Shadow -->
  <ellipse cx="32" cy="62" rx="20" ry="2" fill="#1b2024" opacity="0.35"/>

  <!-- Stepped Marble Base -->
  <polygon points="16,62 48,62 44,54 20,54" fill="#64748b" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Fluted Column Pedestal -->
  <path d="M 27 28 L 37 28 L 37 54 L 27 54 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="32" y1="28" x2="32" y2="54" stroke="#475569" stroke-width="1.4"/>

  <!-- Angled Scribe Bookrest -->
  <polygon points="10,28 54,28 57,22 7,22" fill="#475569" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Open Ancient Tome Pages (Curved Parchment) -->
  <path d="M 12 25 Q 22 19 32 21 Q 42 19 52 25 L 50 11 Q 41 7 32 9 Q 23 7 14 11 Z" 
        fill="#fdfbf5" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Book Spine Binding -->
  <line x1="32" y1="9" x2="32" y2="21" stroke="#854d0e" stroke-width="2.2"/>
  <!-- Ribbon Bookmark hanging down -->
  <path d="M 32 21 Q 33 28 35 32 L 32 30 L 29 32 Q 31 28 32 21 Z" fill="#d97706" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Inscribed Runic Text Lines (Left Page) -->
  <line x1="17" y1="13" x2="28" y2="12" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="17" y1="16" x2="28" y2="15" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="17" y1="19" x2="26" y2="18" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Inscribed Runic Text Lines (Right Page) -->
  <line x1="36" y1="12" x2="47" y2="13" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="15" x2="47" y2="16" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="18" x2="45" y2="19" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Floating Storybook Beacon -->
  <circle cx="32" cy="4" r="3.2" fill="#38bdf8" stroke="#1e293b" stroke-width="0.8"/>
  <polygon points="32,0 33.5,3 36,4 33.5,5 32,8 30.5,5 28,4 30.5,3" fill="#ffffff"/>
</svg>
