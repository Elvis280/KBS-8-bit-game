<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" width="48" height="40">
  <!-- Storybook Illustrated Cute Slime Monster -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="38" rx="19" ry="2" fill="#143019" opacity="0.35"/>

  <!-- Main Slime Gel Body Droplet -->
  <path d="M 6 33 
           C 4 27, 7 19, 13 13 
           C 18 7, 22 3.5, 24 3 
           C 26 3.5, 30 7, 35 13 
           C 41 19, 44 27, 42 33 
           C 40 37.5, 32 37.5, 24 37.5 
           C 16 37.5, 8 37.5, 6 33 Z" 
        fill="#4ade80" stroke="#163e1c" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Cel Shading Bottom Layer -->
  <path d="M 7 32 C 10 36, 38 36, 41 32 C 38 37, 10 37, 7 32 Z" fill="#22c55e"/>

  <!-- Soft Cel Highlight on Upper Droplet -->
  <path d="M 16 11 C 19 7, 23 5, 24 5 C 24 7, 21 11, 17 15 C 16 16, 14 15, 16 11 Z" fill="#bbf7d0"/>
  <ellipse cx="13" cy="18" rx="2.2" ry="3.8" transform="rotate(-25 13 18)" fill="#ffffff" opacity="0.65"/>

  <!-- Big Innocent Chibi Eyes -->
  <!-- Left Eye -->
  <ellipse cx="18" cy="22.5" rx="3.6" ry="4.6" fill="#0f172a" stroke="#163e1c" stroke-width="1"/>
  <ellipse cx="19.2" cy="21" rx="1.6" ry="2.2" fill="#ffffff"/>
  <circle cx="17" cy="24.5" r="0.8" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="30" cy="22.5" rx="3.6" ry="4.6" fill="#0f172a" stroke="#163e1c" stroke-width="1"/>
  <ellipse cx="31.2" cy="21" rx="1.6" ry="2.2" fill="#ffffff"/>
  <circle cx="29" cy="24.5" r="0.8" fill="#ffffff"/>

  <!-- Rosy Cute Cheeks -->
  <ellipse cx="13" cy="26.5" rx="2.5" ry="1.4" fill="#f43f5e" opacity="0.5"/>
  <ellipse cx="35" cy="26.5" rx="2.5" ry="1.4" fill="#f43f5e" opacity="0.5"/>

  <!-- Sweet Slime Smile -->
  <path d="M 22 25.5 Q 24 27.8 26 25.5" fill="none" stroke="#14532d" stroke-width="1.6" stroke-linecap="round"/>
</svg>
