<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Castle Iron Spiked Defense Chest -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="45" rx="18" ry="2.5" fill="#181c22" opacity="0.45"/>

  <!-- Forged Iron Spikes (Top) -->
  <polygon points="14,8 17,0 20,8" fill="#586070" stroke="#1d2128" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="28,8 31,0 34,8" fill="#586070" stroke="#1d2128" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Left Spikes -->
  <polygon points="8,15 0,18 8,21" fill="#586070" stroke="#1d2128" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="8,27 0,30 8,33" fill="#586070" stroke="#1d2128" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Right Spikes -->
  <polygon points="40,15 48,18 40,21" fill="#586070" stroke="#1d2128" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="40,27 48,30 40,33" fill="#586070" stroke="#1d2128" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Main Dark Steel Body -->
  <path d="M 8.5 9.5 C 8 8, 9.5 7, 11 7 L 37 7 C 38.5 7, 40 8, 39.5 9.5 L 40 37.5 C 40 39, 38.5 40, 37 40 L 11 40 C 9.5 40, 8 39, 8 37.5 Z" 
        fill="#3f4552" stroke="#1d2128" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Top Cel Highlight -->
  <path d="M 9.5 8 L 38.5 8 L 38 13 L 9.5 13 Z" fill="#586070"/>
  <path d="M 9 32 L 39 32 L 39 39 L 9 39 Z" fill="#2b303a"/>

  <!-- Bronze Reinforcement Straps -->
  <rect x="13" y="7" width="5" height="33" fill="#b88338" stroke="#1d2128" stroke-width="1.4"/>
  <rect x="30" y="7" width="5" height="33" fill="#b88338" stroke="#1d2128" stroke-width="1.4"/>
  <rect x="8" y="21" width="32" height="5" fill="#b88338" stroke="#1d2128" stroke-width="1.4"/>

  <!-- Rivets -->
  <circle cx="15.5" cy="11" r="1.3" fill="#fdfaf3" stroke="#1d2128" stroke-width="0.7"/>
  <circle cx="15.5" cy="36" r="1.3" fill="#fdfaf3" stroke="#1d2128" stroke-width="0.7"/>
  <circle cx="32.5" cy="11" r="1.3" fill="#fdfaf3" stroke="#1d2128" stroke-width="0.7"/>
  <circle cx="32.5" cy="36" r="1.3" fill="#fdfaf3" stroke="#1d2128" stroke-width="0.7"/>

  <!-- Danger Skull/Hazard Medallion -->
  <circle cx="24" cy="23.5" r="4.5" fill="#991b1b" stroke="#1d2128" stroke-width="1.4"/>
  <circle cx="24" cy="23.5" r="2" fill="#fef08a"/>
</svg>
