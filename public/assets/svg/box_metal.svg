<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Castle Armory Iron & Bronze Chest -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="45" rx="19" ry="2.5" fill="#1c2027" opacity="0.4"/>

  <!-- Main Iron Body -->
  <path d="M 6.5 8 C 6 6.5, 7.5 5, 9.5 5 L 38.5 5 C 40.5 5, 42 6.5, 41.5 8.5 L 42 38.5 C 42 40.5, 40.5 42, 38.5 42 L 9.5 42 C 7.5 42, 6 40.5, 6 38.5 Z" 
        fill="#3f4552" stroke="#21242d" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Top Steel Highlight -->
  <path d="M 8 7 L 40 7 L 39 12 L 8 13 Z" fill="#586070"/>
  <!-- Dark Lower Shadow -->
  <path d="M 7 32 L 41 31 L 41 40 L 7 40 Z" fill="#2d323c"/>

  <!-- Hand-drawn Bronze Metal Bands -->
  <!-- Left Vertical Band -->
  <path d="M 12 5.5 L 18 5.5 L 18 41.5 L 12 41.5 Z" fill="#b88338" stroke="#21242d" stroke-width="1.6"/>
  <!-- Right Vertical Band -->
  <path d="M 30 5.5 L 36 5.5 L 36 41.5 L 30 41.5 Z" fill="#b88338" stroke="#21242d" stroke-width="1.6"/>
  <!-- Center Horizontal Band -->
  <path d="M 6.5 20.5 L 41.5 20.5 L 41.5 27.5 L 6.5 27.5 Z" fill="#b88338" stroke="#21242d" stroke-width="1.6"/>

  <!-- Gilded Bronze Highlights -->
  <line x1="13.5" y1="7" x2="13.5" y2="40" stroke="#f6d57b" stroke-width="1.2"/>
  <line x1="31.5" y1="7" x2="31.5" y2="40" stroke="#f6d57b" stroke-width="1.2"/>
  <line x1="8" y1="22" x2="40" y2="22" stroke="#f6d57b" stroke-width="1.2"/>

  <!-- Storybook Iron Rivets -->
  <circle cx="15" cy="9" r="1.4" fill="#fdfaf3" stroke="#21242d" stroke-width="0.8"/>
  <circle cx="15" cy="24" r="1.4" fill="#fdfaf3" stroke="#21242d" stroke-width="0.8"/>
  <circle cx="15" cy="38" r="1.4" fill="#fdfaf3" stroke="#21242d" stroke-width="0.8"/>
  <circle cx="33" cy="9" r="1.4" fill="#fdfaf3" stroke="#21242d" stroke-width="0.8"/>
  <circle cx="33" cy="24" r="1.4" fill="#fdfaf3" stroke="#21242d" stroke-width="0.8"/>
  <circle cx="33" cy="38" r="1.4" fill="#fdfaf3" stroke="#21242d" stroke-width="0.8"/>

  <!-- Royal Castle Escutcheon & Keyhole -->
  <ellipse cx="24" cy="24" rx="4.5" ry="4.5" fill="#f5eedc" stroke="#21242d" stroke-width="1.4"/>
  <circle cx="24" cy="23" r="1.8" fill="#21242d"/>
  <path d="M 23 23.5 L 25 23.5 L 25.5 27 L 22.5 27 Z" fill="#21242d"/>
</svg>
