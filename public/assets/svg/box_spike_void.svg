<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Void Shattered Spiked Crystal -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="45" rx="18" ry="2.5" fill="#140a1b" opacity="0.5"/>

  <!-- Jagged Amethyst Crystal Shards (Top) -->
  <polygon points="14,8 16,0 20,8" fill="#75398a" stroke="#1d0f24" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="28,8 32,0 34,8" fill="#75398a" stroke="#1d0f24" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Left Crystal Shards -->
  <polygon points="8,15 0,17 8,21" fill="#75398a" stroke="#1d0f24" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="8,27 0,29 8,33" fill="#75398a" stroke="#1d0f24" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Right Crystal Shards -->
  <polygon points="40,15 48,17 40,21" fill="#75398a" stroke="#1d0f24" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="40,27 48,29 40,33" fill="#75398a" stroke="#1d0f24" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Main Dark Void Facet Core -->
  <path d="M 8.5 9.5 C 8 8, 9.5 7, 11 7 L 37 7 C 38.5 7, 40 8, 39.5 9.5 L 40 37.5 C 40 39, 38.5 40, 37 40 L 11 40 C 9.5 40, 8 39, 8 37.5 Z" 
        fill="#2c1636" stroke="#1d0f24" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Crystal Facet Shading -->
  <polygon points="10,8 38,8 24,24" fill="#4d265f"/>
  <polygon points="10,8 10,39 24,24" fill="#3b1c49"/>
  <polygon points="38,8 38,39 24,24" fill="#331740"/>
  <polygon points="10,39 38,39 24,24" fill="#1d0c24"/>

  <!-- Facet Edge Lines -->
  <line x1="10" y1="8" x2="38" y2="39" stroke="#874e9f" stroke-width="1.2"/>
  <line x1="38" y1="8" x2="10" y2="39" stroke="#874e9f" stroke-width="1.2"/>

  <!-- Center Void Singularity Eye -->
  <circle cx="24" cy="23.5" r="5" fill="#e11d48" stroke="#1d0f24" stroke-width="1.4"/>
  <circle cx="24" cy="23.5" r="2.4" fill="#fbcfe8"/>
  <circle cx="24" cy="23.5" r="1" fill="#ffffff"/>
</svg>
