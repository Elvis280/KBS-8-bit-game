<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Sanctuary Spiked Stone Relic -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="45" rx="18" ry="2.5" fill="#1c2024" opacity="0.35"/>

  <!-- Protruding Carved Stone Spikes (Top) -->
  <polygon points="14,8 17,0 20,8" fill="#a49982" stroke="#252723" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="28,8 31,0 34,8" fill="#a49982" stroke="#252723" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Left Stone Spikes -->
  <polygon points="8,15 0,18 8,21" fill="#a49982" stroke="#252723" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="8,27 0,30 8,33" fill="#a49982" stroke="#252723" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Right Stone Spikes -->
  <polygon points="40,15 48,18 40,21" fill="#a49982" stroke="#252723" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="40,27 48,30 40,33" fill="#a49982" stroke="#252723" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Main Stone Core -->
  <path d="M 8.5 9.5 C 8 8, 9.5 7, 11 7 L 37 7 C 38.5 7, 40 8, 39.5 9.5 L 40 37.5 C 40 39, 38.5 40, 37 40 L 11 40 C 9.5 40, 8 39, 8 37.5 Z" 
        fill="#cfc7b4" stroke="#252723" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Top Cel Highlight -->
  <path d="M 9.5 8 L 38.5 8 L 38 13 L 9.5 13 Z" fill="#e5dfcf"/>
  <path d="M 9 32 L 39 32 L 39 39 L 9 39 Z" fill="#ad9f88"/>

  <!-- Moss Clumps -->
  <path d="M 9 8 Q 13 11 15 8 Q 15 13 11 14 Z" fill="#728c66" stroke="#252723" stroke-width="1.2"/>
  <path d="M 35 37 Q 39 34 40 39 Q 36 40 35 37 Z" fill="#728c66" stroke="#252723" stroke-width="1.2"/>

  <!-- Warning Cyan Sanctuary Relic Seal -->
  <rect x="16" y="15.5" width="16" height="16" rx="2" fill="#2d6070" stroke="#252723" stroke-width="1.5"/>
  <circle cx="24" cy="23.5" r="4.5" fill="#4997ab"/>
  <circle cx="24" cy="23.5" r="2" fill="#fdf8e6"/>
</svg>
