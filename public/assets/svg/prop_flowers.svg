<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 32" width="44" height="32">
  <!-- Storybook Illustrated Wildflower Cluster -->
  <!-- Ground Earth Base -->
  <path d="M 6 30 C 14 27, 30 27, 38 30 Z" fill="#4d3b24" opacity="0.35"/>

  <!-- Hand-drawn Grass Blades -->
  <path d="M 7 30 Q 9 17 14 11 Q 14 21 17 30 Z" fill="#588544" stroke="#232d1e" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M 17 30 Q 19 13 23 7 Q 24 19 26 30 Z" fill="#6d9954" stroke="#232d1e" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M 27 30 Q 32 15 36 9 Q 34 21 37 30 Z" fill="#588544" stroke="#232d1e" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Left Golden Buttercup Bloom -->
  <circle cx="12" cy="14" r="5" fill="#facc15" stroke="#232d1e" stroke-width="1.3"/>
  <circle cx="12" cy="14" r="2.2" fill="#854d0e"/>
  <circle cx="11.2" cy="13" r="0.8" fill="#fef08a"/>

  <!-- Center Soft Coral Poppy Bloom -->
  <circle cx="23" cy="10" r="6" fill="#f43f5e" stroke="#232d1e" stroke-width="1.4"/>
  <circle cx="23" cy="10" r="2.5" fill="#881337"/>
  <circle cx="22" cy="9" r="1" fill="#fbcfe8"/>

  <!-- Right Forget-me-not Bloom -->
  <circle cx="34" cy="13" r="4.8" fill="#38bdf8" stroke="#232d1e" stroke-width="1.3"/>
  <circle cx="34" cy="13" r="2" fill="#075985"/>
  <circle cx="33.2" cy="12" r="0.8" fill="#e0f2fe"/>

  <!-- Floating Fairy Pollen Sparks -->
  <circle cx="18" cy="5" r="1.3" fill="#fde047" stroke="#232d1e" stroke-width="0.6"/>
  <circle cx="29" cy="4" r="1.1" fill="#fed7aa" stroke="#232d1e" stroke-width="0.6"/>
</svg>
