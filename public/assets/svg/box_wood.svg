<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Wooden Crate -->
  <defs>
    <filter id="woodSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2c221e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Drop Shadow on ground -->
  <ellipse cx="24" cy="45" rx="19" ry="2.5" fill="#2c221e" opacity="0.35"/>

  <!-- Main Crate Body - Organic Rounded Box -->
  <path d="M 6 8 C 6 6.5, 7.5 5, 9 5 L 39 5 C 40.5 5, 42 6.5, 42 8 L 42 39 C 42 40.5, 40.5 42, 39 42 L 9 42 C 7.5 42, 6 40.5, 6 39 Z" 
        fill="#c68a4c" stroke="#2c221e" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Horizontal Timber Planks with Cel Shading -->
  <!-- Top Plank -->
  <path d="M 6.5 7 L 41.5 7 L 41.5 17 L 6.5 17 Z" fill="#d99b5a"/>
  <!-- Middle Plank -->
  <path d="M 6.5 18 L 41.5 18 L 41.5 29 L 6.5 29 Z" fill="#c68a4c"/>
  <!-- Bottom Plank (Shadowed) -->
  <path d="M 6.5 30 L 41.5 30 L 41.5 41 L 6.5 41 Z" fill="#b07438"/>

  <!-- Hand-drawn Plank Grooves -->
  <path d="M 6 17.5 Q 24 18 42 17" stroke="#2c221e" stroke-width="1.8" fill="none"/>
  <path d="M 6 29.5 Q 24 30 42 29" stroke="#2c221e" stroke-width="1.8" fill="none"/>

  <!-- Organic Wood Grain Lines & Knots -->
  <path d="M 12 12 Q 20 10.5 28 12" stroke="#9e622b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <ellipse cx="34" cy="12" rx="2" ry="1.2" fill="#9e622b"/>
  <path d="M 10 23 Q 18 25 32 23" stroke="#9e622b" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 18 35 Q 26 33.5 36 36" stroke="#874f20" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Hand-Drawn Diagonal Iron Braces -->
  <path d="M 9 9 Q 24 23.5 39 38" stroke="#3d3532" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 9 9 Q 24 23.5 39 38" stroke="#686360" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 39 9 Q 24 23.5 9 38" stroke="#3d3532" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 39 9 Q 24 23.5 9 38" stroke="#686360" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Hand-Drawn Iron Corner Brackets -->
  <path d="M 6 6 L 14 6 L 6 14 Z" fill="#4d4642" stroke="#2c221e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 42 6 L 34 6 L 42 14 Z" fill="#4d4642" stroke="#2c221e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 6 41 L 14 41 L 6 33 Z" fill="#4d4642" stroke="#2c221e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 42 41 L 34 41 L 42 33 Z" fill="#4d4642" stroke="#2c221e" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Charming Iron Rivet Studs -->
  <circle cx="9" cy="9" r="1.5" fill="#f5ebe0" stroke="#2c221e" stroke-width="0.8"/>
  <circle cx="39" cy="9" r="1.5" fill="#f5ebe0" stroke="#2c221e" stroke-width="0.8"/>
  <circle cx="9" cy="38" r="1.5" fill="#f5ebe0" stroke="#2c221e" stroke-width="0.8"/>
  <circle cx="39" cy="38" r="1.5" fill="#f5ebe0" stroke="#2c221e" stroke-width="0.8"/>
  <circle cx="24" cy="23.5" r="2" fill="#d97706" stroke="#2c221e" stroke-width="1"/>
</svg>
