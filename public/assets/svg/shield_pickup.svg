<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Storybook Illustrated Aegis Shield Pickup -->
  <!-- Soft Golden Dawn Halo -->
  <circle cx="16" cy="16" r="14" fill="#fef3c7" opacity="0.45"/>
  <circle cx="16" cy="16" r="12" fill="#99f6e4" opacity="0.3"/>

  <!-- Little Illustrated Fairy Sparks -->
  <polygon points="16,1 17,3 19,4 17,5 16,7 15,5 13,4 15,3" fill="#fbbf24"/>
  <polygon points="4,14 5,16 7,17 5,18 4,20 3,18 1,17 3,16" fill="#fbbf24"/>
  <polygon points="28,14 29,16 31,17 29,18 28,20 27,18 25,17 27,16" fill="#fbbf24"/>

  <!-- Hand-drawn Kite Shield Core -->
  <path d="M 16 5.5 L 24 7.5 C 24 16, 20 21.5, 16 24 C 12 21.5, 8 16, 8 7.5 Z" 
        fill="#3b8785" stroke="#1c252a" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Cel Shading Split -->
  <path d="M 16 6 L 9.5 7.8 C 9.5 15, 12.5 20, 16 22.8 Z" fill="#54b2af"/>
  <path d="M 16 6 L 22.5 7.8 C 22.5 15, 19.5 20, 16 22.8 Z" fill="#2d6d6b"/>

  <!-- Bronze Rim -->
  <path d="M 16 5.5 L 24 7.5 L 22.5 9.5 L 16 8 L 9.5 9.5 L 8 7.5 Z" fill="#cf9036" stroke="#1c252a" stroke-width="0.8"/>

  <!-- Sanctuary Star Gem -->
  <polygon points="16,10 18.5,14 16,18 13.5,14" fill="#fdf8e6" stroke="#1c252a" stroke-width="0.8" stroke-linejoin="round"/>
  <circle cx="16" cy="14" r="1.5" fill="#99f6e4"/>
  <circle cx="16" cy="14" r="0.6" fill="#ffffff"/>
</svg>
