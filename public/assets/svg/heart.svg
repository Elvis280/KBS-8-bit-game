           C 20.5 14.5, 13 19.5, 12 20.5 Z" 
        fill="#e05046" stroke="#341517" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Cel Shadow on Bottom-Right -->
  <path d="M 12 20 C 13.5 18, 19.5 13.5, 20 9 C 20.5 6.5, 19 4.5, 17 4 C 15 5.5, 13 8, 12 11 Z" fill="#c43830" opacity="0.75"/>

