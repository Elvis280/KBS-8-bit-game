<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Storybook Illustrated Young Prince Aurel Portrait -->
  <!-- Soft Golden Dawn Halo -->
  <circle cx="50" cy="45" r="42" fill="#fef9c3" opacity="0.45"/>

  <!-- Royal Sapphire Velvet Cape (Uncorrupted) -->
  <path d="M 22 55 Q 50 48 78 55 L 88 115 Q 50 120 12 115 Z" 
        fill="#2563eb" stroke="#1e293b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Cape Shadow Fold -->
  <path d="M 22 55 Q 35 70 30 116 Q 20 115 12 115 Z" fill="#1d4ed8"/>

  <!-- Golden Pauldrons -->
  <path d="M 16 58 Q 28 50 36 62 Q 24 74 16 58 Z" fill="#facc15" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 84 58 Q 72 50 64 62 Q 76 74 84 58 Z" fill="#facc15" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Royal Golden Breastplate -->
  <path d="M 32 62 Q 50 56 68 62 L 64 105 Q 50 112 36 105 Z" fill="#eab308" stroke="#713f12" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Sun Crest Emblem on Chest -->
  <circle cx="50" cy="80" r="8" fill="#fef08a" stroke="#713f12" stroke-width="1.4"/>
  <circle cx="50" cy="80" r="4" fill="#f59e0b"/>

  <!-- Neck -->
  <rect x="44" y="44" width="12" height="15" fill="#fde68a" stroke="#2c1f19" stroke-width="1.5"/>

  <!-- Chibi Head & Jaw -->
  <path d="M 30 30 Q 28 52 50 56 Q 72 52 70 30 Q 68 12 50 12 Q 32 12 30 30 Z" 
        fill="#fed7aa" stroke="#2c1f19" stroke-width="2" stroke-linejoin="round"/>

  <!-- Rosy Chibi Cheeks -->
  <ellipse cx="36" cy="42" rx="4" ry="2.2" fill="#fca5a5" opacity="0.6"/>
  <ellipse cx="64" cy="42" rx="4" ry="2.2" fill="#fca5a5" opacity="0.6"/>

  <!-- Golden Flowing Locks (Back) -->
  <path d="M 28 26 Q 20 36 26 48 Q 30 38 32 32 Q 50 6 68 32 Q 70 38 74 48 Q 80 36 72 26 Q 66 8 50 8 Q 34 8 28 26 Z" 
        fill="#facc15" stroke="#2c1f19" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 36 18 Q 48 24 62 16 Q 52 11 44 13 Z" fill="#fef08a"/>

  <!-- Golden Circlet of Lumenfall (Before the Dark) -->
  <path d="M 30 24 Q 50 18 70 24 Q 50 20 30 24 Z" fill="#fde047" stroke="#854d0e" stroke-width="2.2"/>
  <polygon points="50,14 47,22 53,22" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>

  <!-- Sad Expressive Chibi Eyes (Clear Azure Blue) -->
  <!-- Left Eye -->
  <ellipse cx="41" cy="34" rx="4" ry="4.8" fill="#ffffff" stroke="#2c1f19" stroke-width="1.4"/>
  <circle cx="41.5" cy="34" r="2.8" fill="#0284c7"/>
  <circle cx="42.5" cy="33" r="1.2" fill="#ffffff"/>
  <circle cx="40" cy="35.5" r="0.6" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="59" cy="34" rx="4" ry="4.8" fill="#ffffff" stroke="#2c1f19" stroke-width="1.4"/>
  <circle cx="58.5" cy="34" r="2.8" fill="#0284c7"/>
  <circle cx="57.5" cy="33" r="1.2" fill="#ffffff"/>
  <circle cx="60" cy="35.5" r="0.6" fill="#ffffff"/>

  <!-- Noble, Sorrowful Eyebrows -->
  <path d="M 36 27 Q 42 26 45 28" stroke="#854d0e" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 64 27 Q 58 26 55 28" stroke="#854d0e" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Nose & Gentle Sad Mouth -->
  <path d="M 50 37 L 49 41 L 51 41" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M 46 47 Q 50 49 54 47" stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
