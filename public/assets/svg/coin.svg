<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Storybook Illustrated Gold Coin -->
  <!-- Subtle Ground Shadow -->
  <ellipse cx="12" cy="21.5" rx="8" ry="1.5" fill="#2d1c10" opacity="0.3"/>

  <!-- Outer Hand-Drawn Wobbly Coin Circle -->
  <path d="M 12 2 C 17.5 2, 22 6.5, 22 12 C 22 17.5, 17.5 22, 12 22 C 6.5 22, 2 17.5, 2 12 C 2 6.5, 6.5 2, 12 2 Z" 
        fill="#fab839" stroke="#302213" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Top Cel Highlight -->
  <path d="M 5 6 Q 12 3.5 19 6 Q 12 5 5 6 Z" fill="#fef3c7"/>
  <!-- Bottom Shadow Rim -->
  <path d="M 4 14 Q 12 20.5 20 14 Q 12 22 4 14 Z" fill="#cf8617"/>

  <!-- Inner Concentric Dotted Beaded Ring -->
  <circle cx="12" cy="12" r="7.2" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="2 1.5"/>

  <!-- Embossed Storybook Crown / Sun Crest -->
  <!-- Center Crown Peak -->
  <path d="M 8.5 14.5 L 9.5 10 L 11 12.5 L 12 9 L 13 12.5 L 14.5 10 L 15.5 14.5 Z" 
        fill="#fef08a" stroke="#68420b" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Coin Base Band -->
  <rect x="8.5" y="14.5" width="7" height="1.5" rx="0.5" fill="#fef08a" stroke="#68420b" stroke-width="0.6"/>
</svg>
