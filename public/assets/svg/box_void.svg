<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Shattered Void Crystal Block -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="45" rx="18" ry="2.5" fill="#150a1c" opacity="0.45"/>

  <!-- Main Crystalline Octagonal Facet Body -->
  <path d="M 14 5.5 L 34 5.5 L 43 14.5 L 43 33.5 L 34 42.5 L 14 42.5 L 5 33.5 L 5 14.5 Z" 
        fill="#2e1a38" stroke="#1d0f24" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Top Prism Light Facet -->
  <polygon points="14,5.5 34,5.5 24,24" fill="#58316a"/>
  <!-- Left Side Facet -->
  <polygon points="5,14.5 14,5.5 24,24 5,33.5" fill="#442553"/>
  <!-- Right Side Facet -->
  <polygon points="34,5.5 43,14.5 43,33.5 24,24" fill="#3c1e49"/>
  <!-- Bottom Shadowed Facet -->
  <polygon points="5,33.5 24,24 43,33.5 34,42.5 14,42.5" fill="#201027"/>

  <!-- Facet Edge Ink Inscriptions -->
  <line x1="24" y1="5.5" x2="24" y2="24" stroke="#1d0f24" stroke-width="1.8"/>
  <line x1="14" y1="5.5" x2="24" y2="24" stroke="#874e9f" stroke-width="1.2"/>
  <line x1="34" y1="5.5" x2="24" y2="24" stroke="#874e9f" stroke-width="1.2"/>
  <line x1="5" y1="33.5" x2="24" y2="24" stroke="#1d0f24" stroke-width="1.6"/>
  <line x1="43" y1="33.5" x2="24" y2="24" stroke="#1d0f24" stroke-width="1.6"/>
  <line x1="24" y1="42.5" x2="24" y2="24" stroke="#1d0f24" stroke-width="1.8"/>

  <!-- Central Starlight Sparkle -->
  <circle cx="24" cy="24" r="5" fill="#a45bbd" stroke="#1d0f24" stroke-width="1.2"/>
  <circle cx="24" cy="24" r="2.8" fill="#fbcfe8"/>
  <circle cx="24" cy="24" r="1.2" fill="#ffffff"/>

  <!-- Tiny Illustrated Cosmic Stars on Surface -->
  <circle cx="12" cy="18" r="1" fill="#f5d0fe" opacity="0.8"/>
  <circle cx="36" cy="18" r="1" fill="#f5d0fe" opacity="0.8"/>
  <circle cx="20" cy="36" r="0.8" fill="#f5d0fe" opacity="0.7"/>
  <circle cx="28" cy="36" r="0.8" fill="#f5d0fe" opacity="0.7"/>
</svg>
