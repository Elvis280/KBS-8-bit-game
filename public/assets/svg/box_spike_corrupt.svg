<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Storybook Illustrated Corrupted Spiked Bramble Box -->
  <!-- Ground Shadow -->
  <ellipse cx="24" cy="45" rx="18" ry="2.5" fill="#1b0e1e" opacity="0.45"/>

  <!-- Protruding Organic Curved Bramble Thorns (Top) -->
  <path d="M 14 9 Q 12 1 15 0 Q 17 4 19 9 Z" fill="#6b2b52" stroke="#221020" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 29 9 Q 32 1 34 0 Q 35 5 33 9 Z" fill="#6b2b52" stroke="#221020" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Left Side Thorns -->
  <path d="M 9 14 Q 1 12 0 15 Q 5 18 9 20 Z" fill="#6b2b52" stroke="#221020" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 9 28 Q 1 30 0 33 Q 5 35 9 36 Z" fill="#6b2b52" stroke="#221020" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Right Side Thorns -->
  <path d="M 39 14 Q 47 12 48 15 Q 43 18 39 20 Z" fill="#6b2b52" stroke="#221020" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 39 28 Q 47 30 48 33 Q 43 35 39 36 Z" fill="#6b2b52" stroke="#221020" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Main Cursed Box Core -->
  <path d="M 8.5 9.5 C 8 8, 9.5 7, 11 7 L 37 7 C 38.5 7, 40 8, 39.5 9.5 L 40 37.5 C 40 39, 38.5 40, 37 40 L 11 40 C 9.5 40, 8 39, 8 37.5 Z" 
        fill="#3b1f3b" stroke="#221020" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Top Cel Highlight -->
  <path d="M 9.5 8 L 38.5 8 L 38 13 L 9.5 13 Z" fill="#522b52"/>
  <path d="M 9 32 L 39 32 L 39 39 L 9 39 Z" fill="#251226"/>

  <!-- Gnarled Bramble Cross Straps -->
  <path d="M 10 10 Q 24 24 38 37" stroke="#221020" stroke-width="3" stroke-linecap="round"/>
  <path d="M 10 10 Q 24 24 38 37" stroke="#933362" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 38 10 Q 24 24 10 37" stroke="#221020" stroke-width="3" stroke-linecap="round"/>
  <path d="M 38 10 Q 24 24 10 37" stroke="#933362" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Warning Cursed Eye Seal in Center -->
  <ellipse cx="24" cy="23.5" rx="6.5" ry="4.5" fill="#e11d48" stroke="#221020" stroke-width="1.4"/>
  <circle cx="24" cy="23.5" r="2.5" fill="#fef08a"/>
  <circle cx="24" cy="23.5" r="1.2" fill="#221020"/>
</svg>
